<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encontros de Livros</title>
<meta name="description" content="Log encounters with physical books in Portugal.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div>
    <h1 data-i18n="appTitle">Encontros de Livros</h1>
    <div class="subtitle" data-i18n="appSubtitle">book encounter log — pilot</div>
  </div>
  <div class="lang-switch" id="lang-switch">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="pt">PT</button>
  </div>
</header>

<main>

  <!-- ===================== CAPTURE VIEW ===================== -->
  <section id="view-capture" class="view active">

    <!-- Camera. The overlay children only render meaningfully while
         body.camera-active is on (see styles.css); they sit ON the video
         rather than in a band below it, so the prompt is where the user is
         already looking. -->
    <div class="camera-wrap hidden" id="camera-wrap">
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="camera-canvas" class="hidden"></canvas>
      <div class="cam-overlay" id="cam-overlay">
        <div class="cam-instruction" id="cam-instruction"></div>
        <div class="cam-reticle hidden" id="cam-reticle"></div>
        <div class="cam-scan-status" id="cam-scan-status"></div>
      </div>
    </div>
    <div class="status-line" id="capture-status"></div>
    <!-- Controls are right-skewed on purpose: for a right-handed one-handed
         grip the thumb arcs from the bottom-right, so the shutter sits in
         that corner and Cancel is pushed to the far left, deliberately the
         most expensive target since it discards the in-progress encounter. -->
    <div class="camera-controls hidden" id="camera-controls">
      <div class="cam-modes" id="cam-modes">
        <button type="button" class="cam-mode" data-mode="identify" data-i18n="camModeIdentify">Identify</button>
        <button type="button" class="cam-mode" data-mode="photo" data-i18n="camModePhoto">Photo</button>
      </div>
      <div class="cam-actions">
        <button type="button" class="cam-text-btn" id="btn-cancel-camera" data-i18n="btnCancel">Cancel</button>
        <button type="button" class="cam-text-btn" id="btn-cam-skip"></button>
        <button type="button" class="cam-shutter" id="btn-shutter"></button>
      </div>
    </div>

    <!-- Location opt-in. Rendered by App.ui.renderLocationBanner(); starts
         hidden and is only shown once its state is known, so it never
         flashes the wrong state on load. -->
    <div class="location-banner hidden" id="location-banner"></div>

    <div class="capture-grid" id="capture-grid">
      <button class="big-button primary" id="btn-scan">
        <span class="icon">📷</span>
        <span data-i18n="btnScanBook">Scan book</span>
      </button>
    </div>

    <div class="search-row">
      <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search title or author…">
      <button class="btn" id="btn-search" data-i18n="btnSearch">Search</button>
    </div>

    <button class="log-anyway" id="btn-log-anyway" data-i18n="btnLogAnyway">Log it anyway — no identification needed</button>

    <div id="search-results"></div>
  </section>

  <!-- ===================== RESULT VIEW ===================== -->
  <section id="view-result" class="view">
    <div class="card" id="result-card"></div>
  </section>

  <!-- ===================== MANUAL / RUNG 5 FORM ===================== -->
  <section id="view-manual" class="view">
    <h2 id="manual-heading" data-i18n="manualHeadingLog">Log this encounter</h2>
    <form class="manual-form" id="manual-form">
      <img id="manual-photo-preview" class="result-photo hidden">

      <label for="m-title" data-i18n="fieldTitle">Title</label>
      <input type="text" id="m-title" name="title">

      <label for="m-author" data-i18n="fieldAuthor">Author</label>
      <input type="text" id="m-author" name="author">

      <label for="m-publisher" data-i18n="fieldPublisher">Publisher</label>
      <input type="text" id="m-publisher" name="publisher">

      <label for="m-year" data-i18n="fieldYear">Year</label>
      <input type="text" id="m-year" name="year" inputmode="numeric">

      <label data-i18n="fieldContext">Context</label>
      <div class="chip-row" id="context-chips">
        <span class="chip" data-value="shop" data-i18n="ctxShop">shop</span>
        <span class="chip" data-value="library" data-i18n="ctxLibrary">library</span>
        <span class="chip" data-value="friend" data-i18n="ctxFriend">friend</span>
        <span class="chip" data-value="fair" data-i18n="ctxFair">fair</span>
        <span class="chip" data-value="secondhand" data-i18n="ctxSecondhand">secondhand</span>
        <span class="chip" data-value="owned" data-i18n="ctxOwned">owned</span>
        <span class="chip" data-value="other" data-i18n="ctxOther">other</span>
      </div>

      <label for="m-location-note" data-i18n="fieldLocationNote">Location note (optional)</label>
      <input type="text" id="m-location-note" data-i18n-placeholder="locationNotePlaceholder" placeholder="e.g. Alfarrabista da Rua Anchieta">

      <label for="m-note" data-i18n="fieldNote">Personal note (optional)</label>
      <textarea id="m-note"></textarea>

      <div class="action-row">
        <button type="button" class="btn" id="btn-manual-cancel" data-i18n="btnCancel">Cancel</button>
        <button type="submit" class="btn primary" id="btn-manual-save" data-i18n="btnSaveEncounter">Save encounter</button>
      </div>
    </form>
  </section>

  <!-- ===================== LOG VIEW ===================== -->
  <section id="view-log" class="view">
    <h2 data-i18n="logHeading">Log</h2>
    <div class="log-filters" id="log-filters">
      <span class="chip selected" data-rung="all" data-i18n="filterAll">all</span>
      <span class="chip" data-rung="1" data-i18n="rungBarcode">Barcode</span>
      <span class="chip" data-rung="2" data-i18n="rungIsbn">Printed ISBN</span>
      <span class="chip" data-rung="3" data-i18n="rungDl">Depósito Legal</span>
      <span class="chip" data-rung="4" data-i18n="rungTitleMatch">Title match</span>
      <span class="chip" data-rung="5" data-i18n="rungManual">Logged by hand</span>
    </div>
    <div id="log-list"></div>
    <div class="action-row">
      <button class="btn" id="btn-seed-random" data-i18n="btnSeedRandom">Add 50 random test locations</button>
    </div>
  </section>

  <!-- ===================== MAP VIEW ===================== -->
  <section id="view-map" class="view">
    <h2 data-i18n="mapHeading">Map</h2>
    <div id="map-root"></div>
  </section>

  <!-- ===================== STATS VIEW ===================== -->
  <section id="view-stats" class="view">
    <h2 data-i18n="statsHeading">Stats</h2>
    <div id="dex-completion"></div>
    <div id="discovery-grid-section"></div>
    <div class="stat-grid" id="stat-tiles"></div>
    <h3 data-i18n="statsRungDistribution">Rung distribution</h3>
    <div id="rung-bars"></div>
    <h3 data-i18n="statsByContext">By context</h3>
    <div id="context-bars"></div>
    <div class="action-row">
      <button class="btn" id="btn-export" data-i18n="btnExportJson">Export JSON</button>
      <button class="btn" id="btn-import" data-i18n="btnImportJson">Import JSON</button>
      <input type="file" id="import-file" accept="application/json" class="hidden">
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="capture"><span class="icon">＋</span><span data-i18n="navCapture">Capture</span></button>
  <button class="nav-btn" data-view="log"><span class="icon">☰</span><span data-i18n="navLog">Log</span></button>
  <button class="nav-btn" data-view="map"><span class="icon">◈</span><span data-i18n="navMap">Map</span></button>
  <button class="nav-btn" data-view="stats"><span class="icon">▤</span><span data-i18n="navStats">Stats</span></button>
</nav>

<!-- Vendored third-party libs (see /lib and README.md) -->
<script src="lib/sqljs-httpvfs/sqljs-httpvfs.js"></script>
<script src="lib/zxing/zxing-reader.js"></script>
<script src="lib/tesseract/tesseract.min.js"></script>

<!-- App code — i18n.js must load first: it sets the active language before
     any other module renders text. -->
<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/idb.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/network.js"></script>
<script src="js/geo.js"></script>
<script src="js/capture.js"></script>
<script src="js/barcode.js"></script>
<script src="js/ocr.js"></script>
<script src="js/ladder.js"></script>
<script src="js/ui.js"></script>
<script src="js/map.js"></script>
<script src="js/main.js"></script>
</body>
</html>
